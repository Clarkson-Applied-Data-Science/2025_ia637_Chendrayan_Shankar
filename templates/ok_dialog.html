{% extends "base.html" %}
{% block title %}Success{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-20 p-6 bg-white rounded shadow">
  <h2 class="text-2xl font-bold text-green-700 mb-4">✅ Done</h2>
  <p class="text-gray-800 mb-6">{{ msg }}</p>
  <div class="text-center">
    <a href="{{ redirect_url or '/' }}"
       class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">
      Continue
    </a>
  </div>
</div>
{% endblock %}
