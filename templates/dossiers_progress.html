{% extends "base.html" %}
{% block title %}Evaluation Progress{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mt-10">
  <h2 class="text-2xl font-bold text-blue-700 mb-6">Evaluation Progress</h2>

  <table class="w-full bg-white shadow rounded">
    <thead class="bg-gray-100 text-left text-sm uppercase">
      <tr>
        <th class="px-4 py-3">Stage</th>
        <th class="px-4 py-3">Reviewer ID</th>
        <th class="px-4 py-3">Status</th>
      </tr>
    </thead>
    <tbody>
      {% for stage in stages %}
      <tr class="border-t hover:bg-gray-50">
        <td class="px-4 py-2">{{ stage.stage_name }}</td>
        <td class="px-4 py-2">{{ stage.reviewer_id }}</td>
        <td class="px-4 py-2">{{ stage.status }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
