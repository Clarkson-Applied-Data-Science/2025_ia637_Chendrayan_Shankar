<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
    <div class="flex justify-center mb-6">
		<img src="{{ url_for('static', filename='images/clarkson_logo.png') }}" alt="Clarkson University Logo" class="h-16">
	</div>
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Register</h2>

    {% if errors %}
    <div class="bg-red-100 text-red-800 px-4 py-2 rounded mb-4 text-sm">
      <ul class="list-disc list-inside">
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    {% set form = form or {} %}
    <form method="POST">
      <div class="mb-4">
        <label class="block mb-1 font-medium">Full Name</label>
        <input type="text" name="name" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" value="{{ form.name or '' }}" required>
      </div>

      <div class="mb-4">
        <label class="block mb-1 font-medium">Email</label>
        <input type="email" name="email" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" value="{{ form.email or '' }}" required>
      </div>

      <div class="mb-4">
        <label class="block mb-1 font-medium">Password</label>
        <input type="password" name="password" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div class="mb-4">
        <label class="block mb-1 font-medium">Confirm Password</label>
        <input type="password" name="password2" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
      </div>

      <div class="mb-4">
        <label class="block font-medium mb-1">Role</label>
        <input type="text" name="role" value="Faculty" readonly
               class="w-full px-4 py-2 border rounded bg-gray-100 text-gray-700 cursor-not-allowed">
      </div>

      <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded">Register</button>
    </form>

    <div class="mt-4 text-center">
      <a href="/login" class="text-sm text-blue-600 hover:underline">Already have an account? Login</a>
    </div>
  </div>
</body>
</html>
