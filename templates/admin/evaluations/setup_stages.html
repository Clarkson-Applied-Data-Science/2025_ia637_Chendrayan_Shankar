{% extends "base.html" %}

{% block title %}Setup Evaluation Stages{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-6 text-blue-700">Define Evaluation Workflow</h2>

  <form method="POST">
    {% for i in range(1, 6) %}
    <div class="mb-6 border-b pb-4">
      <h3 class="font-semibold text-gray-700 mb-2">Stage {{ i }}</h3>

      <label class="block font-medium mb-1">Stage Name</label>
      <input type="text" name="stage_name_{{ i }}" class="w-full border px-4 py-2 rounded mb-2" placeholder="e.g., Self Review or Dean Approval">

      <label class="block font-medium mb-1">Reviewer (User ID)</label>
      <input type="number" name="reviewer_id_{{ i }}" class="w-full border px-4 py-2 rounded" placeholder="Enter reviewer user ID">

      <input type="hidden" name="stage_order_{{ i }}" value="{{ i }}">
    </div>
    {% endfor %}

    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
      Save Workflow
    </button>
  </form>
</div>
{% endblock %}
