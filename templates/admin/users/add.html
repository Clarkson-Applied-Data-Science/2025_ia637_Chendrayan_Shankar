{% extends "base.html" %}

{% block title %}Add User{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4 text-blue-700">Add New User</h2>

  <form method="POST" action="/admin/users/manage?action=insert&pkval=new">
    <div class="mb-4">
      <label class="block font-medium mb-1">Name</label>
      <input type="text" name="name" class="w-full px-4 py-2 border rounded focus:ring focus:ring-blue-300" required>
    </div>

    <div class="mb-4">
      <label class="block font-medium mb-1">Email</label>
      <input type="email" name="email" class="w-full px-4 py-2 border rounded focus:ring focus:ring-blue-300" required>
    </div>

    <div class="mb-4">
      <label class="block font-medium mb-1">Role</label>
      <select name="role" class="w-full px-4 py-2 border rounded focus:ring focus:ring-blue-300">
        <option value="Faculty">Faculty</option>
        <option value="Reviewer">Reviewer</option>
        <option value="Dean">Dean</option>
        <option value="Admin">Admin</option>
      </select>
    </div>

    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Add User</button>
  </form>
</div>
{% endblock %}
