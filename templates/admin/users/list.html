{% extends "base.html" %}

{% block title %}User List{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold mb-6 text-blue-700">All Users</h2>

<div class="mb-4">
    <a href="/admin/users/manage?pkval=new" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        + Add User
    </a>
</div>

<table class="min-w-full bg-white rounded shadow">
  <thead>
    <tr class="bg-gray-100 text-left text-sm uppercase tracking-wider">
      <th class="px-6 py-3">ID</th>
      <th class="px-6 py-3">Name</th>
      <th class="px-6 py-3">Email</th>
      <th class="px-6 py-3">Role</th>
      <th class="px-6 py-3">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for user in obj.data %}
    <tr class="border-b hover:bg-gray-50">
      <td class="px-6 py-4">{{ user.user_id }}</td>
      <td class="px-6 py-4">{{ user.name }}</td>
      <td class="px-6 py-4">{{ user.email }}</td>
      <td class="px-6 py-4">{{ user.role }}</td>
      <td class="px-6 py-4 space-x-2">
        <a href="/admin/users/manage?action=update&pkval={{ user.user_id }}" class="text-blue-600 hover:underline">Edit</a>
        <a href="/admin/users/delete/{{ user.user_id }}" class="text-red-600 hover:underline">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
