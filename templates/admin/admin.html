{% extends "base.html" %}

{% block content %}
    <div class="bg-white p-6 rounded shadow text-center mb-10">
      <h2 class="text-2xl font-bold text-gray-800">Welcome, {{ me.name }} ({{ me.user_id }}, {{ me.role }})</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded shadow">
        <a href="/admin/evaluations/create"
          class="block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded text-center font-semibold">
          ➕ Create Evaluation
        </a>
      </div>
      <div class="bg-white p-6 rounded shadow">
        <a href="/admin/evaluations"
           class="block bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded text-center font-semibold">
           🧭 Open Evaluations Dashboard
        </a>
      </div>
      <div class="bg-white p-6 rounded shadow">
        <h3 class="text-lg font-semibold mb-2">Manage Users</h3>
        <p class="text-gray-600 text-sm mb-4">Edit roles, reset passwords, and manage user access.</p>
        <a href="/admin/users/manage" class="inline-block text-blue-600 font-medium hover:underline">Manage Users</a>
      </div>
    </div>
{% endblock %}
